name: Resume verified CAS deployment
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full SHA of the verified release already checked out and loaded on the VPS
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: cas-production
  cancel-in-progress: false
jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR: ${{ secrets.VPS_APP_DIR || '/var/www/Complain-and-Appeal-System' }}
          DEPLOY_SHA: ${{ inputs.release_sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: APP_DIR,DEPLOY_SHA
          command_timeout: 12m
          script: |
            set -eu
            cd "$APP_DIR"
            test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
            docker image inspect cas-api:local cas-web:local >/dev/null
            free -h
            cat /proc/buddyinfo
            # One-time recovery for the observed veth high-order allocation failure.
            # Sync dirty pages, release clean page cache, then compact free memory.
            # This changes no persistent kernel settings and deletes no files.
            sync
            echo 1 > /proc/sys/vm/drop_caches
            echo 1 > /proc/sys/vm/compact_memory
            cat /proc/buddyinfo
            SKIP_BUILD=1 bash deploy/deploy.sh
