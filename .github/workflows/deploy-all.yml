name: Deploy All (Frontend + API)

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - '**.md'
      - '.gitignore'
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Create production env file
        working-directory: ./frontend
        run: |
          cat > .env.production << EOF
          NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          EOF

      - name: Build Next.js app
        working-directory: ./frontend
        run: npm run build
        env:
          NODE_ENV: production

      - name: Prepare deployment files
        run: |
          mkdir -p deploy-frontend
          # Copy standalone build output
          if [ -d "frontend/.next/standalone" ]; then
            # Standalone mode - copy standalone directory contents
            cp -r frontend/.next/standalone/* deploy-frontend/
            # CRITICAL: Copy node_modules from standalone to root (for cPanel)
            if [ -d "frontend/.next/standalone/node_modules" ]; then
              echo "Copying node_modules from standalone to root..."
              cp -r frontend/.next/standalone/node_modules deploy-frontend/node_modules
            fi
            # CRITICAL: Copy .next directory from standalone (contains BUILD_ID and other required files)
            if [ -d "frontend/.next/standalone/.next" ]; then
              echo "Copying .next directory from standalone..."
              cp -r frontend/.next/standalone/.next deploy-frontend/.next
            fi
            # Also copy static files to .next/static if they exist
            if [ -d "frontend/.next/static" ]; then
              mkdir -p deploy-frontend/.next/static
              cp -r frontend/.next/static/* deploy-frontend/.next/static/
            fi
            # Copy BUILD_ID if it exists (required for production builds)
            if [ -f "frontend/.next/BUILD_ID" ]; then
              mkdir -p deploy-frontend/.next
              cp frontend/.next/BUILD_ID deploy-frontend/.next/BUILD_ID
            fi
            # Copy public folder
            cp -r frontend/public deploy-frontend/public 2>/dev/null || true
            # Ensure server.js exists in root (for cPanel Node.js app)
            if [ ! -f "deploy-frontend/server.js" ] && [ -f "frontend/.next/standalone/server.js" ]; then
              cp frontend/.next/standalone/server.js deploy-frontend/server.js
            fi
            # Copy package.json if it doesn't exist (needed for cPanel)
            if [ ! -f "deploy-frontend/package.json" ]; then
              cp frontend/package.json deploy-frontend/package.json
            fi
          else
            # Fallback: copy full .next directory
            cp -r frontend/.next deploy-frontend/.next
            cp -r frontend/public deploy-frontend/public 2>/dev/null || true
            cp frontend/package.json deploy-frontend/
            cp frontend/next.config.mjs deploy-frontend/
          fi
          # Create .htaccess for Next.js routing (fallback if Node.js app fails)
          cat > deploy-frontend/.htaccess << 'EOF'
          RewriteEngine On
          RewriteBase /
          RewriteRule ^index\.html$ - [L]
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule . /index.html [L]
          EOF
          # List files for debugging
          echo "Deployment files prepared:"
          ls -la deploy-frontend/ | head -20
          if [ -f "deploy-frontend/server.js" ]; then
            echo "✓ server.js found"
          else
            echo "✗ server.js NOT found - this may cause 503 errors"
          fi
          if [ -d "deploy-frontend/node_modules" ]; then
            echo "✓ node_modules found in root"
            ls deploy-frontend/node_modules | head -10
          else
            echo "✗ node_modules NOT found in root - this will cause MODULE_NOT_FOUND errors"
          fi
          if [ -d "deploy-frontend/.next" ]; then
            echo "✓ .next directory found"
            if [ -f "deploy-frontend/.next/BUILD_ID" ]; then
              echo "✓ BUILD_ID found in .next directory"
              cat deploy-frontend/.next/BUILD_ID
            else
              echo "✗ BUILD_ID NOT found in .next directory - this will cause production build errors"
            fi
          else
            echo "✗ .next directory NOT found - this will cause production build errors"
          fi

      - name: Set frontend server directory path
        id: set-frontend-server-dir
        run: |
          # If FRONTEND_DEPLOY_PATH is set, use it; otherwise deploy to FTP root (empty)
          # The FTP user komi@komi.ciroocity.com already logs into komi.ciroocity.com directory
          DEPLOY_PATH="${{ secrets.FRONTEND_DEPLOY_PATH }}"
          if [ -z "$DEPLOY_PATH" ]; then
            # Empty means deploy directly to FTP root (where FTP user logs in)
            DEPLOY_PATH=""
          else
            # If path is provided, ensure it ends with /
            if [[ ! "$DEPLOY_PATH" =~ /$ ]]; then
              DEPLOY_PATH="${DEPLOY_PATH}/"
            fi
          fi
          echo "server-dir=${DEPLOY_PATH}" >> $GITHUB_OUTPUT

      - name: Deploy Frontend to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FRONTEND_FTP_SERVER || secrets.FTP_SERVER }}
          username: ${{ secrets.FRONTEND_FTP_USERNAME }}
          password: ${{ secrets.FRONTEND_FTP_PASSWORD }}
          local-dir: ./deploy-frontend/
          server-dir: ${{ steps.set-frontend-server-dir.outputs.server-dir }}
          protocol: ftp
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/.next/cache/**
            **/.env*
            **/*.log

  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        working-directory: ./api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django checks
        working-directory: ./api
        run: |
          python manage.py check --deploy || true
        env:
          DJANGO_SETTINGS_MODULE: CAS.settings
          SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY || 'dummy-for-check' }}

      - name: Collect static files
        working-directory: ./api
        run: |
          python manage.py collectstatic --noinput || true
        env:
          DJANGO_SETTINGS_MODULE: CAS.settings
          SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY || 'dummy-for-collectstatic' }}

      - name: Prepare deployment files
        run: |
          mkdir -p deploy-api
          cp -r api/* deploy-api/
          # Clean up unnecessary files
          find deploy-api -type d -name "__pycache__" -exec rm -r {} + 2>/dev/null || true
          find deploy-api -type f -name "*.pyc" -delete 2>/dev/null || true
          find deploy-api -type d -name ".pytest_cache" -exec rm -r {} + 2>/dev/null || true
          find deploy-api -type d -name "*.egg-info" -exec rm -r {} + 2>/dev/null || true
          # Create .htaccess for Django
          cat > deploy-api/.htaccess << 'EOF'
          Options -Indexes
          RewriteEngine On
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule ^(.*)$ /api/index.php/$1 [L]
          EOF
          # Create passenger_wsgi.py for Passenger
          cat > deploy-api/passenger_wsgi.py << 'EOF'
          import sys
          import os
          sys.path.insert(0, os.path.dirname(__file__))
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'CAS.settings')
          from django.core.wsgi import get_wsgi_application
          application = get_wsgi_application()
          EOF

      - name: Set API server directory path
        id: set-api-server-dir
        run: |
          DEPLOY_PATH="${{ secrets.API_DEPLOY_PATH || 'komi-api.ciroocity.com' }}"
          # Ensure path ends with /
          if [[ ! "$DEPLOY_PATH" =~ /$ ]]; then
            DEPLOY_PATH="${DEPLOY_PATH}/"
          fi
          echo "server-dir=${DEPLOY_PATH}" >> $GITHUB_OUTPUT

      - name: Deploy API to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.API_FTP_SERVER || secrets.FTP_SERVER }}
          username: ${{ secrets.API_FTP_USERNAME }}
          password: ${{ secrets.API_FTP_PASSWORD }}
          local-dir: ./deploy-api/
          server-dir: ${{ steps.set-api-server-dir.outputs.server-dir }}
          protocol: ftp
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.github/**
            **/__pycache__/**
            **/*.pyc
            **/venv/**
            **/env/**
            **/.venv/**
            **/node_modules/**
            **/.pytest_cache/**
            **/*.egg-info/**
            **/.DS_Store
            **/db.sqlite3
            **/.env*

