name: Verify live CAS browser login
on:
  workflow_dispatch:
    inputs:
      registration_enabled:
        description: Also verify the live Keycloak applicant registration form
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund playwright-core
      - name: Verify CAS renders and reaches Chiro Auth
        env:
          VERIFY_REGISTRATION: ${{ inputs.registration_enabled }}
        run: |
          node <<'NODE'
          const { chromium } = require('playwright-core');
          (async () => {
            const browser = await chromium.launch({ channel: 'chrome', args: ['--no-sandbox'] });
            const page = await browser.newPage();
            try {
              const errors = [];
              page.on('pageerror', error => { errors.push(error.message); console.log('PAGE ERROR', error.message); });
              page.on('requestfailed', req => console.log('REQUEST FAILED', new URL(req.url()).origin + new URL(req.url()).pathname, req.failure()?.errorText));
              page.on('console', msg => { if (msg.type() === 'error') console.log('BROWSER ERROR', msg.text()); });
              await page.goto('https://cas.chirocity.gov.et/login', { waitUntil: 'domcontentloaded', timeout: 60000 });
              const login = page.getByRole('button', { name: 'Sign in with Chiro Auth' });
              await login.waitFor({ timeout: 30000 });
              console.log('CAS central login screen rendered.');
              for (const viewport of [{ width: 1920, height: 1080 }, { width: 768, height: 1024 }, { width: 375, height: 812 }]) {
                await page.setViewportSize(viewport);
                await page.getByRole('link', { name: 'Sign up as an applicant' }).waitFor();
                const bounds = await page.getByTestId('cas-auth-card').boundingBox();
                const overflow = await page.evaluate(() => document.documentElement.scrollWidth > window.innerWidth);
                if (overflow || !bounds || bounds.x < 0 || bounds.x + bounds.width > viewport.width + 1 || bounds.y < 0) throw new Error('Cropped auth layout at '+JSON.stringify(viewport));
                console.log('Auth layout fits:', JSON.stringify(viewport));
                await page.screenshot({ path: `cas-login-${viewport.width}.png`, fullPage: true });
              }
              await page.getByRole('link', { name: 'Sign up as an applicant' }).click();
              await page.getByRole('button', { name: 'Create applicant account' }).waitFor();
              console.log('Applicant sign-up page rendered.');
              await page.screenshot({ path: 'cas-applicant-signup.png', fullPage: true });
              await page.getByRole('link', { name: 'Sign in', exact: true }).click();
              await login.waitFor();
              await login.click();
              await page.waitForURL('https://auth.chirocity.gov.et/**', { timeout: 30000 });
              await page.locator('#username').waitFor({ timeout: 30000 });
              console.log('Chiro Auth username/password form reached.');
              await page.screenshot({ path: 'chiro-auth-login.png' });
              if (process.env.VERIFY_REGISTRATION === 'true') {
                await page.goto('https://cas.chirocity.gov.et/login', { waitUntil: 'domcontentloaded', timeout: 60000 });
                await page.getByRole('link', { name: 'Sign up as an applicant' }).click();
                await page.getByRole('button', { name: 'Create applicant account' }).click();
                await page.waitForURL('https://auth.chirocity.gov.et/**', { timeout: 30000 });
                await page.locator('#kc-register-form').waitFor({ timeout: 30000 });
                console.log('Applicant registration reaches the Chiro Auth registration form.');
                await page.screenshot({ path: 'chiro-auth-registration.png', fullPage: true });
              }
              if (errors.length) throw new Error(errors.join('\n'));
              console.log('No JavaScript runtime errors.');
            } catch (error) {
              console.log('Visible page:', (await page.locator('body').innerText()).slice(0, 1800));
              await page.screenshot({ path: 'cas-failure.png' });
              throw error;
            } finally { await browser.close(); }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cas-browser-check
          path: '*.png'
          retention-days: 1
