name: Deploy API to cPanel

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'api/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        working-directory: ./api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django checks
        working-directory: ./api
        run: |
          python manage.py check --deploy || true
        env:
          DJANGO_SETTINGS_MODULE: CAS.settings
          SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY || 'dummy-for-check' }}

      - name: Collect static files
        working-directory: ./api
        run: |
          python manage.py collectstatic --noinput || true
        env:
          DJANGO_SETTINGS_MODULE: CAS.settings
          SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY || 'dummy-for-collectstatic' }}

      - name: Prepare deployment files
        run: |
          mkdir -p deploy-api
          # Copy API files
          cp -r api/* deploy-api/
          # Remove unnecessary files
          find deploy-api -type d -name "__pycache__" -exec rm -r {} + 2>/dev/null || true
          find deploy-api -type f -name "*.pyc" -delete 2>/dev/null || true
          find deploy-api -type d -name ".pytest_cache" -exec rm -r {} + 2>/dev/null || true
          find deploy-api -type d -name "*.egg-info" -exec rm -r {} + 2>/dev/null || true
          # Create .htaccess for Django
          cat > deploy-api/.htaccess << 'EOF'
          Options -Indexes
          RewriteEngine On
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule ^(.*)$ /api/index.php/$1 [L]
          EOF
          # Create passenger_wsgi.py if using Passenger
          cat > deploy-api/passenger_wsgi.py << 'EOF'
          import sys
          import os
          sys.path.insert(0, os.path.dirname(__file__))
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'CAS.settings')
          from django.core.wsgi import get_wsgi_application
          application = get_wsgi_application()
          EOF

      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.API_FTP_SERVER || secrets.FTP_SERVER }}
          username: ${{ secrets.API_FTP_USERNAME }}
          password: ${{ secrets.API_FTP_PASSWORD }}
          local-dir: ./deploy-api/
          server-dir: ${{ secrets.API_DEPLOY_PATH || 'komi-api.ciroocity.com' }}
          protocol: ftp
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.github/**
            **/__pycache__/**
            **/*.pyc
            **/venv/**
            **/env/**
            **/.venv/**
            **/node_modules/**
            **/.pytest_cache/**
            **/*.egg-info/**
            **/.DS_Store
            **/db.sqlite3
            **/.env*

      - name: Run migrations via SSH (Optional)
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            cd ${{ secrets.API_DEPLOY_PATH || 'komi-api.ciroocity.com' }}
            source venv/bin/activate || true
            python manage.py migrate --noinput || true
