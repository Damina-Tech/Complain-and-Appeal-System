name: Inspect Complain-and-Appeal-System VPS
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [inspect, expand-var]
        default: inspect
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        env:
          OPERATION: ${{ inputs.operation }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: OPERATION
          script: |
            set -eu
            df -h /var/lib/docker
            df -i /var/lib/docker
            docker system df
            df -h / /tmp /var
            vgs || true
            findmnt /var
            lvs --units b --nosuffix -o lv_path,lv_size
            if [ "$OPERATION" = expand-var ]; then
              test "$(findmnt -n -o SOURCE /var)" = /dev/mapper/vg0-lv--1
              test "$(findmnt -n -o FSTYPE /var)" = xfs
              size=$(lvs --noheadings --units b --nosuffix -o lv_size /dev/vg0/lv-1 | tr -d ' ')
              if awk "BEGIN {exit !($size < 10300000000)}"; then
                lvextend --size +384M --resizefs /dev/vg0/lv-1
              fi
              df -h /var
              exit 0
            fi
            for path in /var/www/Complain-and-Appeal-System /var/www/Complain-and-Appeal-System/Complain-and-Appeal-System; do
              if [ -d "$path/.git" ]; then
                echo "Complain-and-Appeal-System clone: $path"
                git -C "$path" remote -v
                git -C "$path" status --short
                if [ -f "$path/.env" ]; then echo 'Root production .env exists'; fi
              fi
            done
            docker ps --format '{{.Names}} {{.Image}} {{.Ports}}'
            docker inspect --format '{{.Name}} networks={{json .NetworkSettings.Networks}}' hrms-proxy-1
            cd /var/www/Complain-and-Appeal-System
            if docker inspect cas-cas-api-1 >/dev/null 2>&1; then
              CAS_DATA_DIR=/srv/cas docker compose exec -T cas-api python manage.py shell <<'PY'
            import uuid, secrets
            from django.db import transaction
            from django.contrib.auth import get_user_model
            from django.test import Client
            with transaction.atomic():
                username = 'deployment-check-' + uuid.uuid4().hex
                password = secrets.token_urlsafe(32)
                get_user_model().objects.create_user(username=username, password=password, is_staff=True, is_superuser=True)
                client = Client(HTTP_HOST='cas-api.chirocity.gov.et')
                response = client.post('/api/login/', {'username': username, 'password': password}, content_type='application/json')
                assert response.status_code == 200, 'Login failed: ' + str(response.status_code)
                token = response.json()['access']
                response = client.get('/api/auth/me/', HTTP_AUTHORIZATION='Bearer ' + token)
                assert response.status_code == 200, 'Authenticated profile failed'
                transaction.set_rollback(True)
            print('Login and authenticated profile passed; temporary test account rolled back.')
            print('Existing users:', get_user_model().objects.count())
            PY
            fi
