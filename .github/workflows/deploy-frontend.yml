name: Deploy Frontend to cPanel

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Create production env file
        working-directory: ./frontend
        run: |
          cat > .env.production << EOF
          NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          EOF

      - name: Build Next.js app
        working-directory: ./frontend
        run: npm run build
        env:
          NODE_ENV: production

      - name: Prepare deployment files
        run: |
          mkdir -p deploy-frontend
          # Copy necessary files for Next.js standalone output
          if [ -d "frontend/.next/standalone" ]; then
            # Standalone mode - copy standalone directory
            cp -r frontend/.next/standalone/* deploy-frontend/
            # Create .next directory for static files
            mkdir -p deploy-frontend/.next
            # Copy static files if they exist
            if [ -d "frontend/.next/static" ]; then
              cp -r frontend/.next/static deploy-frontend/.next/static
            fi
            # Copy public folder
            cp -r frontend/public deploy-frontend/public 2>/dev/null || true
          else
            # Fallback: copy full .next directory
            cp -r frontend/.next deploy-frontend/.next
            cp -r frontend/public deploy-frontend/public 2>/dev/null || true
            cp frontend/package.json deploy-frontend/
            cp frontend/next.config.mjs deploy-frontend/
          fi
          # Create .htaccess for Next.js routing
          cat > deploy-frontend/.htaccess << 'EOF'
          RewriteEngine On
          RewriteBase /
          RewriteRule ^index\.html$ - [L]
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule . /index.html [L]
          EOF

      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FRONTEND_FTP_SERVER || secrets.FTP_SERVER }}
          username: ${{ secrets.FRONTEND_FTP_USERNAME }}
          password: ${{ secrets.FRONTEND_FTP_PASSWORD }}
          local-dir: ./deploy-frontend/
          server-dir: ${{ secrets.FRONTEND_DEPLOY_PATH || 'komi.ciroocity.com/' }}
          protocol: ftp
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/.next/cache/**
            **/.env*
            **/*.log
            **/.DS_Store

